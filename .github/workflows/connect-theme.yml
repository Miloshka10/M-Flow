name: Check M-Flow theme

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  connect-theme:
    # Respect explicit deploy skips; this job never writes source or bot commits.
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip render]') && !contains(github.event.head_commit.message, '[render skip]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify theme CSS without editing source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          if '/static/mflow-theme.css' not in text or not Path('static/mflow-theme.css').is_file():
              raise SystemExit('Theme stylesheet is missing or not connected')
          print('Theme is connected; source files are unchanged')
          PY
