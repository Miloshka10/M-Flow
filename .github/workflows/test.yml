name: M-Flow safety tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: mflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      M_FLOW_TEST_POSTGRES_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/mflow_test?sslmode=disable
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Python checks on disposable databases
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript checks
        run: |
          node tests/test_kanban.cjs
          node tests/test_dashboard.cjs
          node tests/test_motion.cjs
          node tests/test_preferences.cjs
