<div lang="ru" style="max-width:600px;margin:0 auto;padding:24px;background:#f5f4ef;color:#202532;font-family:Arial,sans-serif;font-size:16px;line-height:1.6;">
  <div style="padding:24px;background:#ffffff;border:1px solid #e4e6ec;border-radius:16px;">
    <h2 style="margin:0 0 20px;font-size:26px;line-height:1.2;">M-Flow<span style="color:#274de5;">.</span></h2>

    {{#action_url}}
